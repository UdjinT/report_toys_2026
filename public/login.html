<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Report Toys — Вход</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html, body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		body[data-theme="dark"] {
			background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
		}

		.login-container {
			width: 100%;
			max-width: 400px;
			padding: 2rem;
		}

		.login-card {
			background: white;
			border-radius: 12px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			padding: 3rem 2rem;
			text-align: center;
		}

		[data-theme="dark"] .login-card {
			background: #1e1e2e;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
		}

		.login-title {
			font-size: 1.75rem;
			font-weight: 700;
			margin-bottom: 0.5rem;
			color: #212529;
		}

		[data-theme="dark"] .login-title {
			color: #ffffff;
		}

		.login-subtitle {
			font-size: 0.9rem;
			color: #6c757d;
			margin-bottom: 2rem;
		}

		[data-theme="dark"] .login-subtitle {
			color: #adb5bd;
		}

		.form-group {
			margin-bottom: 1.5rem;
			text-align: left;
		}

		label {
			display: block;
			font-size: 0.875rem;
			font-weight: 500;
			margin-bottom: 0.5rem;
			color: #495057;
		}

		[data-theme="dark"] label {
			color: #dee2e6;
		}

		input {
			width: 100%;
			padding: 0.75rem 1rem;
			border: 1px solid #dee2e6;
			border-radius: 6px;
			font-size: 1rem;
			font-family: inherit;
			transition: all 0.2s;
			background: #ffffff;
			color: #212529;
		}

		[data-theme="dark"] input {
			background: #2d2d3d;
			border-color: #404050;
			color: #ffffff;
		}

		input:focus {
			outline: none;
			border-color: #667eea;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
		}

		[data-theme="dark"] input:focus {
			border-color: #667eea;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
		}

		.btn-login {
			width: 100%;
			padding: 0.875rem;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			border-radius: 6px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s;
			margin-top: 1rem;
		}

		.btn-login:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
		}

		.btn-login:active {
			transform: translateY(0);
		}

		.btn-login:disabled {
			opacity: 0.6;
			cursor: not-allowed;
			transform: none;
		}

		.error-message {
			display: none;
			padding: 0.75rem 1rem;
			background: #f8d7da;
			border: 1px solid #f5c6cb;
			border-radius: 6px;
			color: #721c24;
			font-size: 0.875rem;
			margin-bottom: 1.5rem;
		}

		[data-theme="dark"] .error-message {
			background: rgba(248, 105, 109, 0.15);
			border-color: #f86569;
			color: #ff6b6b;
		}

		.error-message.show {
			display: block;
		}

		.theme-toggle {
			position: absolute;
			top: 2rem;
			right: 2rem;
			width: 44px;
			height: 44px;
			background: rgba(255, 255, 255, 0.2);
			border: 1px solid rgba(255, 255, 255, 0.3);
			border-radius: 6px;
			cursor: pointer;
			font-size: 1.25rem;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s;
		}

		.theme-toggle:hover {
			background: rgba(255, 255, 255, 0.3);
		}

		[data-theme="dark"] .theme-toggle {
			background: rgba(0, 0, 0, 0.2);
			border-color: rgba(255, 255, 255, 0.2);
		}
	</style>
</head>
<body>
	<button id="themeToggle" class="theme-toggle" title="Переключить тему">🌙</button>

	<div class="login-container">
		<div class="login-card">
			<h1 class="login-title">Report Toys</h1>
			<p class="login-subtitle">Панель администратора</p>

			<div id="errorMessage" class="error-message"></div>

			<form id="loginForm">
				<div class="form-group">
					<label for="username">Логин</label>
					<input
						type="text"
						id="username"
						name="username"
						placeholder="Введите логин"
						required
						autocomplete="username"
					/>
				</div>

				<div class="form-group">
					<label for="password">Пароль</label>
					<input
						type="password"
						id="password"
						name="password"
						placeholder="Введите пароль"
						required
						autocomplete="current-password"
					/>
				</div>

				<button type="submit" class="btn-login" id="loginBtn">Вход</button>
			</form>
		</div>
	</div>

	<script>
		// Theme toggle
		const themeToggle = document.getElementById('themeToggle');
		const htmlElement = document.documentElement;
		const savedTheme = localStorage.getItem('theme') || 'light';

		function applyTheme(theme) {
			htmlElement.setAttribute('data-theme', theme);
			themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
		}

		applyTheme(savedTheme);

		themeToggle.addEventListener('click', () => {
			const currentTheme = htmlElement.getAttribute('data-theme') || 'light';
			const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
			applyTheme(newTheme);
			localStorage.setItem('theme', newTheme);
		});

		// Login form
		const loginForm = document.getElementById('loginForm');
		const errorMessage = document.getElementById('errorMessage');
		const loginBtn = document.getElementById('loginBtn');

		loginForm.addEventListener('submit', async (e) => {
			e.preventDefault();
			errorMessage.classList.remove('show');

			const username = document.getElementById('username').value;
			const password = document.getElementById('password').value;

			loginBtn.disabled = true;
			loginBtn.textContent = 'Проверка...';

			try {
				const response = await fetch('/api/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password })
				});

				const data = await response.json();

				if (data.success) {
					localStorage.setItem('adminToken', data.token);
					window.location.href = '/admin.html';
				} else {
					errorMessage.textContent = 'Неверные логин или пароль';
					errorMessage.classList.add('show');
				}
			} catch (error) {
				errorMessage.textContent = 'Ошибка подключения. Попробуйте позже.';
				errorMessage.classList.add('show');
			} finally {
				loginBtn.disabled = false;
				loginBtn.textContent = 'Вход';
			}
		});

		// Check if already logged in
		if (localStorage.getItem('adminToken')) {
			window.location.href = '/admin.html';
		}
	</script>
</body>
</html>
