<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Bot</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #0f172a; color: #f1f5f9; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; }
        button:hover { background: #2563eb; }
        #output { margin-top: 20px; padding: 10px; background: #1e293b; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🤖 Telegram Bot Tester</h1>
    <button onclick="testWebhook()">Send Test Message</button>
    <div id="output">Жди результата...</div>

    <script>
        async function testWebhook() {
            const output = document.getElementById('output');
            output.textContent = 'Отправляю тест...';

            try {
                const response = await fetch('/test/webhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                output.textContent = 'Ошибка: ' + e.message;
            }
        }
    </script>
</body>
</html>
